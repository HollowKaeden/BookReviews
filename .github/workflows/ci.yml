name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Быстрый прогон на SQLite: без внешней БД, ловит логику приложения.
  tests:
    runs-on: ubuntu-latest
    env:
      # Тесты работают на SQLite, но app.config при импорте требует эти
      # переменные (в CI нет .env). Значения фиктивные: реальную БД не трогаем.
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  # Тот же набор тестов против реального Postgres плюс проверка миграций.
  # Ловит диалект-специфику, которую SQLite не воспроизводит.
  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookreviews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # TEST_DATABASE_URL переключает движок в conftest на Postgres.
      # DATABASE_URL нужен app.config при импорте и alembic при миграциях.
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/bookreviews_test"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/bookreviews_test"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests against Postgres
        run: pytest -q

      - name: Verify migrations apply on Postgres
        run: |
          alembic upgrade head
          alembic downgrade base

  docker-build:
    # Образ публикуем только после зелёных тестов.
    needs: [tests, tests-postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Пуш в реестр и деплой только на push в main; на PR образ просто собирается.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hollowkaeden/bookreviews
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сообщаем портфолио, что вышел новый образ: оно передеплоит сервер.
      # Токен: fine-grained PAT с Contents: read and write только на репо portfolio.
      - name: Trigger portfolio deploy
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN не задан, деплой не запущен"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HollowKaeden/portfolio/dispatches \
            -d '{"event_type":"deploy","client_payload":{"source":"bookreviews","sha":"${{ github.sha }}"}}'
          echo "Деплой портфолио запущен"
