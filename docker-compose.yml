services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookreviews
      POSTGRES_PASSWORD: bookreviews
      POSTGRES_DB: bookreviews
    ports:
      # Хостовый порт 5433, чтобы не конфликтовать с локально установленным Postgres на 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookreviews"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
